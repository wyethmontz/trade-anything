name: Trading Signal Bot

on:
  workflow_dispatch:  # triggered on a schedule by cron-job.org

# Runs are queued instead of running in parallel, so two overlapping triggers
# (e.g. a short polling interval) can't race on the signal-log commit/push below.
concurrency:
  group: trading-signal-bot
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the updated signal log back to the repo

jobs:
  send-signal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          ASSET_KEY: ${{ vars.ASSET_KEY || secrets.ASSET_KEY || 'natural_gas' }}
          TRADING_MODE: ${{ vars.TRADING_MODE || secrets.TRADING_MODE || 'scalp' }}
          ONLY_SEND_BUY: ${{ vars.ONLY_SEND_BUY || secrets.ONLY_SEND_BUY || 'true' }}
        run: python run_bot.py

      - name: Persist signal log
        run: |
          git config user.name "trading-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signal_log.csv
          git diff --cached --quiet || git commit -m "chore: update signal log"
          git pull --rebase origin main
          git push

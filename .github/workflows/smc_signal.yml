name: SMC Signal Bot

on:
  workflow_dispatch:  # triggered every ~15 min by your own external cron (e.g. cron-job.org)

# Runs are queued instead of running in parallel, so overlapping triggers
# can't race on the state-file commit/push below.
concurrency:
  group: smc-signal-bot
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the updated state file back to the repo

jobs:
  send-smc-signal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SMC signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASSET_KEY: ${{ vars.ASSET_KEY || secrets.ASSET_KEY || 'gold' }}
        run: python run_smc_bot.py

      - name: Persist SMC signal state
        run: |
          git config user.name "smc-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/smc_signal_state.csv
          git diff --cached --quiet || git commit -m "chore: update smc signal state"
          git pull --rebase origin main
          git push
